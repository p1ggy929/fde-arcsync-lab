<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2100" viewBox="0 0 1680 2100" role="img" aria-labelledby="title desc">
<title id="title">云州档案 ArcSync 业务流程图</title><desc id="desc">包括申请、权限核验、整理员接手、检索、原卷核对、审核员接手、审核与交付，以及异常转人工、审核退回和服务反馈闭环。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#587767"/></marker><marker id="amberArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b27c37"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Arial Unicode MS",sans-serif}.title{font-size:43px;font-weight:650;fill:#214f40}.subtitle{font-size:22px;fill:#7c897d}.label{font-size:23px;font-weight:600;fill:#355746}.small{font-size:20px;fill:#7c8978}.tag{font-size:18px;fill:#8b7248}.line{fill:none;stroke:#6c8977;stroke-width:2.8;stroke-linejoin:round;marker-end:url(#arrow)}.branch{fill:none;stroke:#b27c37;stroke-width:2.8;stroke-linejoin:round;marker-end:url(#amberArrow)}.guide{font-size:21px;fill:#657960}</style>
<rect width="1680" height="2100" fill="#f7f9f4"/><rect x="45" y="39" width="9" height="90" rx="4" fill="#285d49"/>
<text x="80" y="81" class="title">云州档案 · ArcSync 业务流程图</text>
<text x="80" y="122" class="subtitle">从申请到交付与反馈｜原卷依据随单流转，跨岗交接以确认接手为准</text>
<rect x="575" y="166" width="530" height="1800" rx="22" fill="#edf3e9"/>
<text x="840" y="199" text-anchor="middle" class="small">主业务流程</text>
<text x="280" y="695" text-anchor="middle" class="label">异常处理闭环</text>
<text x="1375" y="1090" text-anchor="middle" class="label">审核退回闭环</text>
<polyline points="840,300 840,350" class="line"/>
<polyline points="840,435 840,480" class="line"/>
<polyline points="840,565 840,610" class="line"/>
<polyline points="840,705 840,750" class="line"/>
<polyline points="840,870 840,920" class="line"/>
<polyline points="840,1005 840,1050" class="line"/>
<polyline points="840,1135 840,1180" class="line"/>
<polyline points="840,1300 840,1340" class="line"/>
<polyline points="840,1425 840,1470" class="line"/>
<polyline points="840,1555 840,1600" class="line"/>
<polyline points="840,1685 840,1730" class="line"/>
<polyline points="840,1815 840,1860" class="line"/>
<polyline points="610,810 470,810" class="branch"/>
<text x="480" y="783" class="tag">否 / 依据不完整</text>
<polyline points="280,855 280,920" class="branch"/>
<polyline points="280,1015 280,1080" class="branch"/>
<polyline points="280,1175 280,1240" class="branch"/>
<polyline points="90,1295 45,1295 45,657 620,657" class="branch"/>
<text x="80" y="631" class="tag">复核恢复后重新检索</text>
<polyline points="1070,1240 1180,1240" class="branch"/>
<text x="1090" y="1215" class="tag">退回</text>
<polyline points="1370,1290 1370,1350" class="branch"/>
<polyline points="1560,1400 1620,1400 1620,963 1060,963" class="branch"/>
<text x="1230" y="940" class="tag">重新核对、确认引用</text>
<rect x="620" y="220" width="440" height="80" rx="13" fill="#285d49" stroke="#285d49" stroke-width="1.8"/>
<text x="840.0" y="252.0" text-anchor="middle" class="label" style="fill:#ffffff">创建查阅申请</text>
<text x="840.0" y="285.0" text-anchor="middle" class="small" style="fill:#dbe7d5">查询代表 / 整理员 / 审核员</text>
<rect x="620" y="350" width="440" height="85" rx="13" fill="#ffffff" stroke="#cbdac5" stroke-width="1.8"/>
<text x="840.0" y="384.5" text-anchor="middle" class="label" style="fill:#355746">核验公开档案试点权限</text>
<text x="840.0" y="417.5" text-anchor="middle" class="small" style="fill:#7c8978">审核员 · 状态：待权限核验</text>
<rect x="620" y="480" width="440" height="85" rx="13" fill="#ffffff" stroke="#cbdac5" stroke-width="1.8"/>
<text x="840.0" y="514.5" text-anchor="middle" class="label" style="fill:#355746">整理员确认接手</text>
<text x="840.0" y="547.5" text-anchor="middle" class="small" style="fill:#7c8978">确认后才转移业务责任</text>
<rect x="620" y="610" width="440" height="95" rx="13" fill="#ffffff" stroke="#cbdac5" stroke-width="1.8"/>
<text x="840.0" y="649.5" text-anchor="middle" class="label" style="fill:#355746">授权检索与原卷阅读</text>
<text x="840.0" y="682.5" text-anchor="middle" class="small" style="fill:#7c8978">查看档号、版本、双页码与更正关系</text>
<polygon points="840,750 1070,810 840,870 610,810" fill="#f9f2df" stroke="#d6bc87" stroke-width="1.8"/>
<text x="840" y="803" text-anchor="middle" class="label">资料与引用依据可用？</text><text x="840" y="834" text-anchor="middle" class="small">版本有效 · 页码明确 · 依据完整</text>
<text x="865" y="902" class="tag">是</text>
<rect x="620" y="920" width="440" height="85" rx="13" fill="#ffffff" stroke="#cbdac5" stroke-width="1.8"/>
<text x="840.0" y="954.5" text-anchor="middle" class="label" style="fill:#355746">人工核对并确认卷页引用</text>
<text x="840.0" y="987.5" text-anchor="middle" class="small" style="fill:#7c8978">整理员 · 引用绑定具体资料版本</text>
<rect x="620" y="1050" width="440" height="85" rx="13" fill="#ffffff" stroke="#cbdac5" stroke-width="1.8"/>
<text x="840.0" y="1084.5" text-anchor="middle" class="label" style="fill:#355746">提交审核 → 审核员确认接手</text>
<text x="840.0" y="1117.5" text-anchor="middle" class="small" style="fill:#7c8978">提交后等待接手，责任不提前转移</text>
<polygon points="840,1180 1070,1240 840,1300 610,1240" fill="#f9f2df" stroke="#d6bc87" stroke-width="1.8"/>
<text x="840" y="1233" text-anchor="middle" class="label">人工审核通过？</text><text x="840" y="1264" text-anchor="middle" class="small">复查授权范围、引用与未解决异常</text>
<text x="865" y="1327" class="tag">通过</text>
<rect x="620" y="1340" width="440" height="85" rx="13" fill="#ffffff" stroke="#cbdac5" stroke-width="1.8"/>
<text x="840.0" y="1374.5" text-anchor="middle" class="label" style="fill:#355746">审核通过，进入待交付</text>
<text x="840.0" y="1407.5" text-anchor="middle" class="small" style="fill:#7c8978">审核员填写依据与适用说明</text>
<rect x="620" y="1470" width="440" height="85" rx="13" fill="#ffffff" stroke="#cbdac5" stroke-width="1.8"/>
<text x="840.0" y="1504.5" text-anchor="middle" class="label" style="fill:#355746">记录人工交付，导出交付记录</text>
<text x="840.0" y="1537.5" text-anchor="middle" class="small" style="fill:#7c8978">审核员 · 状态：已交付</text>
<rect x="620" y="1600" width="440" height="85" rx="13" fill="#ffffff" stroke="#cbdac5" stroke-width="1.8"/>
<text x="840.0" y="1634.5" text-anchor="middle" class="label" style="fill:#355746">关联原业务登记反馈（如有）</text>
<text x="840.0" y="1667.5" text-anchor="middle" class="small" style="fill:#7c8978">查询代表 · 填写当时资料版本</text>
<rect x="620" y="1730" width="440" height="85" rx="13" fill="#ffffff" stroke="#cbdac5" stroke-width="1.8"/>
<text x="840.0" y="1764.5" text-anchor="middle" class="label" style="fill:#355746">审核员核对反馈结果</text>
<text x="840.0" y="1797.5" text-anchor="middle" class="small" style="fill:#7c8978">反馈：已核对；原业务仍为已交付</text>
<rect x="620" y="1860" width="440" height="80" rx="13" fill="#285d49" stroke="#285d49" stroke-width="1.8"/>
<text x="840.0" y="1892.0" text-anchor="middle" class="label" style="fill:#ffffff">完成闭环 · 审计追溯</text>
<text x="840.0" y="1925.0" text-anchor="middle" class="small" style="fill:#dbe7d5">核对人、时间、版本、引用与人工改动</text>
<rect x="90" y="755" width="380" height="100" rx="13" fill="#fff8ec" stroke="#e3cba4" stroke-width="1.8"/>
<text x="280.0" y="797.0" text-anchor="middle" class="label" style="fill:#355746">暂停建议，记录异常</text>
<text x="280.0" y="830.0" text-anchor="middle" class="small" style="fill:#7c8978">整理员 · 明确原因与关联业务</text>
<rect x="90" y="920" width="380" height="95" rx="13" fill="#fff8ec" stroke="#e3cba4" stroke-width="1.8"/>
<text x="280.0" y="959.5" text-anchor="middle" class="label" style="fill:#355746">审核员分派实际处理岗位</text>
<text x="280.0" y="992.5" text-anchor="middle" class="small" style="fill:#7c8978">工程师 / 整理员 / 保护专员等</text>
<rect x="90" y="1080" width="380" height="95" rx="13" fill="#fff8ec" stroke="#e3cba4" stroke-width="1.8"/>
<text x="280.0" y="1119.5" text-anchor="middle" class="label" style="fill:#355746">处理人填写依据与结果</text>
<text x="280.0" y="1152.5" text-anchor="middle" class="small" style="fill:#7c8978">原档案不覆盖，质量标记不自动解除</text>
<rect x="90" y="1240" width="380" height="110" rx="13" fill="#fff8ec" stroke="#e3cba4" stroke-width="1.8"/>
<text x="280.0" y="1287.0" text-anchor="middle" class="label" style="fill:#355746">审核员接手并复核恢复</text>
<text x="280.0" y="1320.0" text-anchor="middle" class="small" style="fill:#7c8978">随后由整理员确认接手</text>
<rect x="1180" y="1190" width="380" height="100" rx="13" fill="#fff8ec" stroke="#e3cba4" stroke-width="1.8"/>
<text x="1370.0" y="1232.0" text-anchor="middle" class="label" style="fill:#355746">审核员填写退回原因</text>
<text x="1370.0" y="1265.0" text-anchor="middle" class="small" style="fill:#7c8978">回到定位中，清空旧引用</text>
<rect x="1180" y="1350" width="380" height="100" rx="13" fill="#fff8ec" stroke="#e3cba4" stroke-width="1.8"/>
<text x="1370.0" y="1392.0" text-anchor="middle" class="label" style="fill:#355746">整理员接手并补充说明</text>
<text x="1370.0" y="1425.0" text-anchor="middle" class="small" style="fill:#7c8978">重新确认依据，再提交审核</text>
<rect x="1170" y="245" width="400" height="390" rx="16" fill="#ffffff" stroke="#dde5d5"/>
<text x="1200" y="290" class="label">贯穿全程的约束</text>
<circle cx="1207" cy="330" r="3" fill="#8ca47f"/><text x="1220" y="337" class="guide">先授权，再展示目录与卷页</text>
<circle cx="1207" cy="378" r="3" fill="#8ca47f"/><text x="1220" y="385" class="guide">扫描页序号与纸质页码分别核对</text>
<circle cx="1207" cy="426" r="3" fill="#8ca47f"/><text x="1220" y="433" class="guide">更正关系有疑问时转人工</text>
<circle cx="1207" cy="474" r="3" fill="#8ca47f"/><text x="1220" y="481" class="guide">建议、草稿与原记录分别保存</text>
<circle cx="1207" cy="522" r="3" fill="#8ca47f"/><text x="1220" y="529" class="guide">草稿、引用和签核均留有记录</text>
<circle cx="1207" cy="570" r="3" fill="#8ca47f"/><text x="1220" y="577" class="guide">管理权限不自动扩大查档权限</text>
<rect x="1170" y="1580" width="400" height="325" rx="16" fill="#fff8ec" stroke="#e4cfaa"/>
<text x="1200" y="1625" class="label">风险控制</text>
<text x="1200" y="1675" class="guide">主任 / 保护专员可暂停试点</text>
<text x="1200" y="1720" class="guide">暂停后停止正常业务推进</text>
<text x="1200" y="1765" class="guide">仍可保存草稿、处理人工异常</text>
<text x="1200" y="1810" class="guide">仅保护专员可复盘后恢复</text>
<text x="1200" y="1855" class="guide">开放范围、密级与处置不自动变更</text>
<line x1="70" y1="1995" x2="1610" y2="1995" stroke="#dce4d5"/><text x="80" y="2032" class="small">绿色：正常流转　　琥珀色：判断、异常与退回　　所有跨岗位业务交接均须确认接手</text>
<text x="80" y="2070" class="small">适用：ArcSync v0.1.0 合成数据演示版｜反馈路径按需进入｜功能闭环不等于真实业务验收通过</text></svg>